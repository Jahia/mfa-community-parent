# default configuration - won't be overridden
# MFA shared extensions configuration. The marker line above tells Jahia's module extender NOT
# to overwrite the deployed <karaf>/etc/org.jahia.modules.mfa.extensions.cfg on restart, so
# operator edits survive; the components re-read them live (on @Modified).
#
# This PID is shared by the factor-agnostic infrastructure in the mfa-factors-extensions bundle:
# the /cms/login gate (MfaLoginGateFilter) and — see the section added by the login/logout URL
# provider — the redirect URLs. It replaces the equivalent keys that previously lived under
# org.jahia.modules.totp. MIGRATION: existing deployments must move loginGate.* (and loginUrl /
# logoutUrl) from org.jahia.modules.totp to this PID.

# --- Global enrollment policy (MfaGlobalPolicy) --------------------------------
# Comma-separated factor types that are ENFORCED platform-wide (e.g. totp,webauthn).
# A user must have AT LEAST ONE of these configured and verify ONE of them at sign-in;
# a user with none configured is taken through inline enrollment on the login page once
# the grace window below has elapsed. Empty (default) = no enforcement: factors stay
# opt-in per site and never block a user who has not set them up.
# NOTE: per-site activation still applies — a factor must also be enabled on the site
# (each factor's administration page) to take part.
enforcedFactors=

# Grace window in DAYS before enforcement becomes hard-required for a user who has none
# of the enforced factors configured (counted per user from their first enforced sign-in
# attempt). 0 = immediate. Clamped to 0..365.
graceDays=0

# --- /cms/login gate (MfaLoginGateFilter + MfaLoginGateAuthValve) ---------------
# Jahia's legacy /cms/login endpoint authenticates with username/password only and
# never consults MFA factors — while enforcement is active (enforcedFactors above) it
# is a complete second-factor bypass. When enabled, this gate rejects /cms/login with
# 403 while an enforced factor is enabled on the request's site (identifiable via the
# `site` parameter, otherwise when ANY site has one enabled), unless the client IP
# matches the whitelist below.
#
# NOTE: a password POST to /cms/login is blocked by the authentication valve
# (MfaLoginGateAuthValve) whenever enforcement is active, INDEPENDENTLY of the
# loginGate.enabled switch below — that switch only tunes the servlet filter's GET
# behavior. The bypass must always be closed; the switch chooses how strict the GET
# handling is.
#
# OFF by default on purpose: enabling it with an empty whitelist locks everyone
# (including platform administrators) out of /cms/login as soon as one site
# enforces enrollment. Set the whitelist FIRST, then flip this to true.
loginGate.enabled=false

# Comma-separated IPv4/IPv6 addresses or CIDR blocks allowed through the gate.
# The client IP is the raw socket peer address by default, or the FIRST
# X-Forwarded-For entry when loginGate.trustForwardedFor=true below (see that
# key's SECURITY note before enabling it).
# Example: loginGate.ipWhitelist=203.0.113.7, 10.0.0.0/8, 2001:db8::/32
loginGate.ipWhitelist=

# Whether to read the client IP (for the whitelist above) from the X-Forwarded-For
# header. OFF by default (SEC-135): X-Forwarded-For is client-spoofable, so
# leaving this on with no reverse proxy in front of Jahia lets an attacker forge
# the header to match a whitelisted IP and bypass MFA enforcement outright. Only
# set this to true when Jahia sits behind a reverse proxy that OVERWRITES (not
# merely appends to) the header - and even then, when running behind Tomcat's
# RemoteIpValve (enabled by default on the Jahia EE image), lock its
# internalProxies/trustedProxies down to that proxy's actual address rather than
# relying on the shipped permissive default (see GHSA-4v3g-mcmj-83fp).
loginGate.trustForwardedFor=false

# Whether to ALSO gate a password presented in an "Authorization: Basic" header.
# OFF by default, and the default is the safe one — read this before flipping it.
#
# WHAT IT CLOSES: Jahia's HttpBasicAuthValve authenticates a username/password from
# that header and never consults MFA factors, exactly like /cms/login. While
# enforcement is active, `curl -u user:password https://.../modules/graphql` is
# therefore a complete second-factor bypass for anyone holding a stolen password.
# Setting this to true refuses it with 403 before authentication happens.
#
# WHAT IT COSTS: unlike /cms/login, that header is not tied to one endpoint — it is
# how EVERY non-interactive client authenticates, everywhere. With this on and one
# site enforcing a factor, the following all start answering 403 platform-wide:
#   - /modules/api/provisioning  (including this very configuration)
#   - /modules/graphql and /modules/tools/*
#   - WebDAV, CI jobs, monitoring probes, custom integrations
# Those callers must move to a personal API token (Jahia's TokenAuthValve is NOT
# gated) BEFORE you flip this. Plan that migration first; this is not a hot switch.
#
# KEEP A WAY BACK IN. loginGate.ipWhitelist is the only HTTP escape hatch, and it
# does NOT work in every topology: behind a reverse proxy — including Tomcat's
# RemoteIpValve, enabled by default on the Jahia EE image — the whitelist match
# fails CLOSED unless loginGate.trustForwardedFor=true as well (GHSA-4v3g-mcmj-83fp,
# see that key). If the whitelist cannot match, the only way to revert this key is
# editing <karaf.etc>/org.jahia.modules.mfa.extensions.cfg on the server filesystem.
# Verify a whitelisted client actually gets through BEFORE enabling this.
loginGate.gateBasicAuth=false

# --- Login / logout URL provider (MfaLoginLogoutProvider) ----------------------
# These are the GLOBAL DEFAULTS for the shared login/logout URL provider, which routes
# unauthenticated users to the MFA login UI (username/password, then a choice between the
# enrolled factors — TOTP, WebAuthn, ...). Each site can override them from its factor
# administration page; a per-site value (surfaced by any factor through the MfaSiteProvider
# SPI) always takes precedence over the value below.
#
# The page that renders the MFA login UI (the `totpui:authentication` component shipped by
# the mfa-factors-login-ui module). Unauthenticated users hitting a protected resource are
# redirected here instead of /cms/login.
# - Leave empty (default) and configure per-site instead, or to keep Jahia's default login
#   handling on sites that set no URL.
# - When set, the URL must be a Jahia page path reachable WITHOUT authentication that carries
#   the site key. Example: /sites/mySite/login.html
loginUrl=

# Optional custom sign-out page (global default; overridable per site). Leave empty to use
# Jahia's default logout handling. Example: /sites/mySite/logout.html
logoutUrl=

# --- Locked-out MFA reset request (MfaResetRequestMutationExtension) -------------
# When a user has proven their password but cannot pass the second factor (lost authenticator,
# no backup codes, no other factor), the login UI offers a "request a reset" action. It notifies
# the administrator(s) below by email; an admin then runs the existing reset mutations
# (upa.mfaFactors.totp.resetUserMfa / webauthn.resetUserWebauthn) for that user.
# Comma-separated recipient addresses. LEAVE EMPTY to disable the feature: with no recipient the
# request is rate-limited, logged, and no email is sent (the UI still shows a generic confirmation).
# Example: resetRequest.notifyEmail=security@example.com, helpdesk@example.com
resetRequest.notifyEmail=
